name: Application assistant checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python behavior and HTTP integration tests
        run: python -m unittest discover -s tests -v
      - name: Browser helper matching and post import
        run: node --test tests/*.test.cjs
      - name: Python syntax
        run: python -m compileall -q agent scripts tests
      - name: Browser script syntax
        run: for file in web/*.js extension/*.js tests/*runner.js tests/social-fixture.js; do node --check "$file"; done
